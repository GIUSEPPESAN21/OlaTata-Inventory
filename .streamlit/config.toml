[theme]
base = "light"
primaryColor = "#C2185B"
backgroundColor = "#FDEFF0"
secondaryBackgroundColor = "#FCE8EC"
textColor = "#2B1B22"
linkColor = "#C2185B"
font = "Inter"
headingFont = "Playfair Display"
baseFontSize = 18
baseRadius = "16px"
buttonRadius = "16px"
showWidgetBorder = true
dataframeHeaderBackgroundColor = "#C2185B"
dataframeHeaderTextColor = "#FFFFFF"
metricValueFontSize = "2rem"
metricValueFontWeight = 700
chartCategoricalColors = ["#C2185B", "#C09860", "#FC7DA9", "#7A5A1F", "#2B1B22"]

# Fuentes autoalojadas (C2): servidas por Streamlit desde `static/fonts/`
# (requiere server.enableStaticServing=true, ver abajo). Subconjunto
# "latin" (cubre español: áéíóúñ¿¡) descargado con
# `scripts/build_logo_assets.py`-adjacent sources — ver assets/fonts/
# para la copia de referencia legible por humanos.
[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter-400.woff2"
weight = "400"
style = "normal"

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter-500.woff2"
weight = "500"
style = "normal"

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter-600.woff2"
weight = "600"
style = "normal"

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter-700.woff2"
weight = "700"
style = "normal"

[[theme.fontFaces]]
family = "Playfair Display"
url = "app/static/fonts/playfair-display-600.woff2"
weight = "600"
style = "normal"

[[theme.fontFaces]]
family = "Great Vibes"
url = "app/static/fonts/great-vibes-400.woff2"
weight = "400"
style = "normal"

# Iconografía (sin emojis en la UI, §9): Material Symbols Outlined
# autoalojado (descargado una vez de Google Fonts, igual trato que las
# tipografías de marca) para los iconos `:material/nombre:`-style que usan
# `core.ui.chip_estado`, `core.ui.icono_md` y la navegación lateral.
[[theme.fontFaces]]
family = "Material Symbols Outlined"
url = "app/static/fonts/material-symbols-outlined.woff2"
weight = "400"
style = "normal"

[server]
enableXsrfProtection = true
enableStaticServing = true
maxUploadSize = 20

[browser]
gatherUsageStats = false

[client]
# Seguridad: nunca mostrar trazas ni tipos de excepción en el navegador
# (filtran rutas y detalles internos). El detalle va solo al log del
# servidor; la app ya muestra mensajes amables con código de incidente.
showErrorDetails = "none"
# Sin opciones de desarrollador (rerun, limpiar caché, deploy) en la barra
# superior; el resto de iconos se ocultan además desde assets/theme.css.
toolbarMode = "minimal"
showSidebarNavigation = false
